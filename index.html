<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Юбилеем! 50 лет!</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Georgia', serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #ff9a3c 0%, #ff6b35 25%, #c1440e 50%, #7a2e0e 75%, #3d1405 100%);
        background-size: 400% 400%;
        animation: autumnBg 18s ease infinite;
        display: flex; justify-content: center; align-items: center;
        overflow-x: hidden; padding: 20px;
    }
    @keyframes autumnBg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .leaf {
        position: fixed; top: -10vh; font-size: 28px; opacity: 0.8;
        z-index: 0; animation: fall linear infinite;
        pointer-events: none; user-select: none;
    }
    @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(720deg); }
    }

    .bg-cake {
        position: fixed; z-index: 1; pointer-events: none; user-select: none;
        font-size: 46px; opacity: 0.35;
        animation: cakeFloat 7s ease-in-out infinite;
        filter: drop-shadow(0 6px 10px rgba(122,46,14,0.4));
    }
    @keyframes cakeFloat {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50% { transform: translateY(-26px) rotate(6deg); }
    }

    .scene {
        position: relative; width: 100%; max-width: 860px; min-height: 600px;
        background: rgba(255, 248, 235, 0.97);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(61, 20, 5, 0.6), inset 0 0 0 6px rgba(255, 154, 60, 0.3);
        padding: 55px 30px 30px; z-index: 5; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .scene::before, .scene::after {
        content: '🍁'; position: absolute; font-size: 60px; opacity: 0.25; z-index: 0;
    }
    .scene::before { top: -10px; left: -5px; transform: rotate(-25deg); }
    .scene::after { bottom: -15px; right: -5px; transform: rotate(155deg); }

    .garland {
        position: absolute; top: 0; left: 0; width: 100%; height: 42px;
        display: flex; justify-content: space-around; align-items: flex-start;
        z-index: 2; pointer-events: none; overflow: hidden;
    }
    .garland::before {
        content: ''; position: absolute; top: 6px; left: 0; width: 100%; height: 2px;
        background: rgba(193, 68, 14, 0.5);
    }
    .flag {
        width: 0; height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 26px solid #ff6b35;
        margin-top: 6px;
        animation: flagSway 2.6s ease-in-out infinite;
        transform-origin: top center;
    }
    .flag:nth-child(2n) { border-top-color: #ffd28a; }
    .flag:nth-child(3n) { border-top-color: #c1440e; }
    .flag:nth-child(4n) { border-top-color: #ff9a3c; }
    @keyframes flagSway {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
    }

    .host-container {
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        position: relative; z-index: 3;
    }
    .host-container.hidden { display: none; }

    .character {
        position: relative; font-size: 110px; line-height: 1;
        animation: bob 2.2s ease-in-out infinite;
        filter: drop-shadow(0 12px 12px rgba(0,0,0,0.25));
        cursor: pointer; user-select: none;
        transition: transform 0.15s ease;
    }
    .character.knocking { animation: knock 0.55s ease; }
    @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-14px) rotate(2deg); }
    }
    @keyframes knock {
        0% { transform: translateY(0) scale(1); }
        20% { transform: translateY(-10px) scale(1.06) rotate(-6deg); }
        40% { transform: translateY(4px) scale(0.96) rotate(6deg); }
        60% { transform: translateY(-10px) scale(1.06) rotate(-6deg); }
        80% { transform: translateY(4px) scale(0.96) rotate(6deg); }
        100% { transform: translateY(0) scale(1); }
    }

    .screen-wall {
        position: absolute; top: 42%; left: 50%;
        width: 230px; height: 230px; transform: translate(-50%, -50%);
        border: 4px dashed rgba(193, 68, 14, 0.25); border-radius: 20px;
        pointer-events: none; z-index: -1;
        animation: wallPulse 2s ease-in-out infinite;
    }
    @keyframes wallPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 154, 60, 0); }
        50% { box-shadow: 0 0 40px 12px rgba(255, 154, 60, 0.28); }
    }

    .knock-effect {
        position: absolute; top: 38%; left: 50%;
        transform: translate(-50%, -50%); font-size: 40px;
        pointer-events: none; opacity: 0; z-index: 10;
    }
    .knock-effect.show { animation: knockBurst 0.7s ease forwards; }
    @keyframes knockBurst {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
        100% { opacity: 0; transform: translate(-50%, -130%) scale(1.8); }
    }

    .speech-bubble {
        position: relative;
        background: linear-gradient(135deg, #fff8e7, #ffe8c4);
        border: 3px solid #c1440e; border-radius: 22px;
        padding: 20px 26px; max-width: 580px; text-align: center;
        font-size: 1.15rem; color: #5a1e05; font-weight: 600; line-height: 1.5;
        box-shadow: 0 8px 22px rgba(122, 46, 14, 0.3);
        animation: bubblePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 3;
    }
    .speech-bubble::after {
        content: ''; position: absolute; bottom: -16px; left: 50%;
        transform: translateX(-50%);
        border-width: 16px 14px 0 14px; border-style: solid;
        border-color: #c1440e transparent transparent transparent;
    }
    @keyframes bubblePop {
        0% { transform: scale(0.6); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .family-card {
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        width: 100%; animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative; z-index: 3;
    }
    @keyframes cardIn {
        0% { transform: translateX(60px) scale(0.9); opacity: 0; }
        100% { transform: translateX(0) scale(1); opacity: 1; }
    }

    .avatar-wrap {
        position: relative; width: 150px; height: 150px;
        border-radius: 50%;
        background: linear-gradient(145deg, #ff9a3c, #ffd28a);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 25px rgba(193, 68, 14, 0.4), inset 0 0 0 5px rgba(255,255,255,0.7);
        animation: avatarFloat 3s ease-in-out infinite;
    }
    @keyframes avatarFloat {
        0%, 100% { transform: translateY(0) rotate(-1.5deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
    }
    .avatar-wrap .emoji {
        font-size: 82px; line-height: 1;
        animation: wave 2.5s ease-in-out infinite;
        transform-origin: 70% 80%;
    }
    @keyframes wave {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(8deg); }
    }

    .name-tag {
        font-size: 1.5rem; font-weight: 800; color: #7a2e0e;
        background: rgba(255, 209, 138, 0.75); padding: 6px 22px;
        border-radius: 30px; border: 2px solid #c1440e;
        box-shadow: 0 4px 12px rgba(122, 46, 14, 0.25);
        animation: nameGlow 2s ease-in-out infinite;
    }
    @keyframes nameGlow {
        0%, 100% { box-shadow: 0 4px 12px rgba(122, 46, 14, 0.25); }
        50% { box-shadow: 0 4px 22px rgba(255, 154, 60, 0.7); }
    }

    .confetti-piece {
        position: absolute; width: 10px; height: 16px; opacity: 0;
        z-index: 20; pointer-events: none; border-radius: 2px;
    }
    .confetti-piece.show { animation: confettiFall 1.4s ease-out forwards; }
    @keyframes confettiFall {
        0% { opacity: 1; transform: translateY(0) rotate(0deg); }
        100% { opacity: 0; transform: translateY(340px) rotate(600deg); }
    }

    .controls {
        display: flex; gap: 16px; margin-top: 26px; flex-wrap: wrap;
        justify-content: center; z-index: 10;
    }
    .btn {
        padding: 14px 30px; font-size: 1.05rem; font-weight: 700;
        border: none; border-radius: 40px; cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
        font-family: inherit; letter-spacing: 0.3px; outline: none;
    }
    .btn:active { transform: scale(0.94); }
    .btn-next {
        background: linear-gradient(135deg, #ff9a3c, #ff6b35);
        color: #fff8e7; box-shadow: 0 6px 18px rgba(255, 107, 53, 0.5);
        text-shadow: 0 1px 2px rgba(122, 46, 14, 0.5);
    }
    .btn-next:hover { box-shadow: 0 8px 26px rgba(255, 107, 53, 0.75); }
    .btn-back {
        background: rgba(255, 248, 231, 0.9); color: #7a2e0e;
        border: 2px solid #c1440e; box-shadow: 0 4px 12px rgba(122, 46, 14, 0.2);
    }
    .btn-back:hover { background: #ffe8c4; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .finale { text-align: center; animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .finale h1 {
        font-size: 2.4rem;
        background: linear-gradient(135deg, #ff6b35, #c1440e, #ff9a3c);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; margin-bottom: 12px;
        animation: titlePulse 2s ease-in-out infinite;
    }
    @keyframes titlePulse {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 154, 60, 0)); }
        50% { filter: drop-shadow(0 0 14px rgba(255, 154, 60, 0.7)); }
    }
    .finale p { font-size: 1.15rem; color: #5a1e05; line-height: 1.7; font-weight: 600; }
    .finale .big-emoji {
        font-size: 70px; display: inline-block;
        animation: cakeBounce 1.8s ease-in-out infinite;
    }
    @keyframes cakeBounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-14px) scale(1.08); }
    }

    .progress-dots { display: flex; gap: 9px; margin-top: 18px; justify-content: center; }
    .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: rgba(193, 68, 14, 0.25); transition: all 0.3s ease;
    }
    .dot.active { background: #ff6b35; transform: scale(1.25); box-shadow: 0 0 10px rgba(255, 107, 53, 0.8); }
    .dot.done { background: #ffb347; }

    @media (max-width: 600px) {
        .scene { padding: 50px 16px 22px; min-height: 540px; }
        .character { font-size: 80px; }
        .speech-bubble { font-size: 1rem; padding: 16px 18px; }
        .avatar-wrap { width: 120px; height: 120px; }
        .avatar-wrap .emoji { font-size: 62px; }
        .name-tag { font-size: 1.25rem; }
        .btn { padding: 12px 20px; font-size: 0.92rem; }
        .finale h1 { font-size: 1.65rem; }
    }
</style>
</head>
<body>

<div id="leavesContainer"></div>
<div id="cakesContainer"></div>

<div class="scene" id="scene">
    <div class="garland" id="garland"></div>

    <div class="host-container" id="hostStage">
        <div class="screen-wall"></div>
        <div class="knock-effect" id="knockEffect">👊</div>
        <div class="character" id="hostCharacter" title="Нажми на меня!">🧙‍♂️</div>
        <div class="speech-bubble" id="hostBubble">Ооооо, у кого это тут день рождение?! 👀</div>
    </div>

    <div id="familyStage" style="display:none; width:100%;"></div>
    <div id="finaleStage" style="display:none; width:100%;"></div>

    <div class="controls" id="controls">
        <button class="btn btn-back" id="btnBack" disabled>⏪ Вернуться чуть назад</button>
        <button class="btn btn-next" id="btnNext">Читать далее ➡️</button>
    </div>

    <div class="progress-dots" id="progressDots"></div>
</div>

<script>
/* ============ ДАННЫЕ ============ */
const familyMembers = [
    {
        name: "Гуля",
        role: "Жена",
        emoji: "👩",
        text: "Дорогой мой, любимый мой мужчина! 50 лет — это не просто цифра, это целая жизнь, полная любви, заботы и наших общих воспоминаний. Спасибо, что ты рядом, что ты — опора нашей семьи. Ты самый лучший отец и самый надёжный муж. С юбилеем, любимый! Будь здоров, счастлив и всегда улыбайся! ❤️"
    },
    {
        name: "Руслан",
        role: "Старший сын",
        emoji: "👨",
        text: "Пап, с юбилеем! 🎉 Я уже взрослый мужчина, и с высоты своего жизненного опыта точно знаю: ты для меня — главный пример настоящего мужчины. Сильный, честный, справедливый. Спасибо за всё, чему ты меня научил, и за то, что всегда поддерживаешь. Желаю тебе крепкого здоровья, долгих лет и чтобы мечты сбывались! Горжусь тобой, отец! 💪"
    },
    {
        name: "Алёна",
        role: "Дочь",
        emoji: "👧",
        text: "Папочка, любимый мой! С юбилеем! 🥰 Я уже взрослая и самостоятельная, но рядом с тобой всегда чувствую себя твоей маленькой девочкой. Ты — самый добрый, заботливый и крутой папа на свете. Спасибо за тёплые объятия, мудрые советы и за то, что всегда веришь в меня. Будь счастлив, здоров, и пусть каждый день приносит радость! Обожаю тебя! 🌸"
    },
    {
        name: "Андрей",
        role: "Младший сын",
        emoji: "👦",
        text: "Папа… даже не знаю, с чего начать, потому что для меня ты — не просто папа. Ты — мой герой, моя опора и мой самый главный человек в жизни. 🌟 Сколько себя помню, ты всегда рядом: когда мне было страшно — ты успокаивал, когда я ошибался — ты не ругал, а учил, когда я падал — ты протягивал руку. Ты научил меня быть сильным, но при этом добрым, не сдаваться и идти к своей мечте. Я смотрю на тебя и знаю, каким должен быть настоящий мужчина — честным, надёжным и любящим. Спасибо тебе за каждую бессонную ночь, за каждый совет, за каждое твоё «я в тебя верю». Без тебя я бы не стал тем, кто я есть. Ты — самый важный человек в моей жизни, и я горжусь, что ты мой папа. ❤️ С юбилеем! Будь здоров, счастлив и знай: я всегда рядом, как и ты всегда был рядом со мной. 💪🙏"
    }
];

const finaleText = {
    title: "🎉 С Юбилеем, дорогой наш! 50 лет! 🎉",
    body: "Ты — Именинник-Отец и муж в самой крутой семье на свете!<br><br>" +
          "Гуля, Руслан, Алёна и Андрей вместе с Хранителем Осеннего Праздника желают тебе:<br>" +
          "🌟 крепкого здоровья,<br>" +
          "🍁 уютной осени в душе и тепла в доме,<br>" +
          "🎂 счастья, любви и долгих лет!<br><br>" +
          "Пусть этот юбилей запомнится навсегда!",
    emoji: "🥳🎂🍁"
};

/* ============ СОСТОЯНИЕ ============ */
let currentStep = 0;
const totalSteps = familyMembers.length + 3;

const el = {
    hostStage: document.getElementById('hostStage'),
    familyStage: document.getElementById('familyStage'),
    finaleStage: document.getElementById('finaleStage'),
    controls: document.getElementById('controls'),
    btnBack: document.getElementById('btnBack'),
    btnNext: document.getElementById('btnNext'),
    hostCharacter: document.getElementById('hostCharacter'),
    hostBubble: document.getElementById('hostBubble'),
    knockEffect: document.getElementById('knockEffect'),
    progressDots: document.getElementById('progressDots'),
    scene: document.getElementById('scene')
};

/* ============ ФОН ============ */
(function createLeaves() {
    const container = document.getElementById('leavesContainer');
    const leafEmojis = ['🍁', '🍂', '🍃', '🌰'];
    for (let i = 0; i < 18; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
        leaf.style.left = Math.random() * 100 + 'vw';
        leaf.style.fontSize = (18 + Math.random() * 22) + 'px';
        leaf.style.animationDuration = (8 + Math.random() * 10) + 's';
        leaf.style.animationDelay = (Math.random() * 12) + 's';
        leaf.style.opacity = 0.4 + Math.random() * 0.5;
        container.appendChild(leaf);
    }
})();

(function createCakes() {
    const container = document.getElementById('cakesContainer');
    const cakes = ['🎂', '🧁', '🍰', '🎂'];
    const positions = [
        { left: '4%', top: '12%' }, { left: '88%', top: '18%' },
        { left: '8%', top: '72%' }, { left: '90%', top: '68%' },
        { left: '46%', top: '88%' }, { left: '2%', top: '42%' }
    ];
    positions.forEach((pos, i) => {
        const cake = document.createElement('div');
        cake.className = 'bg-cake';
        cake.textContent = cakes[i % cakes.length];
        cake.style.left = pos.left;
        cake.style.top = pos.top;
        cake.style.animationDelay = (i * 0.7) + 's';
        container.appendChild(cake);
    });
})();

(function createGarland() {
    const g = document.getElementById('garland');
    for (let i = 0; i < 16; i++) {
        const flag = document.createElement('div');
        flag.className = 'flag';
        flag.style.animationDelay = (i * 0.15) + 's';
        g.appendChild(flag);
    }
})();

/* ============ ПРОГРЕСС ============ */
function renderDots() {
    el.progressDots.innerHTML = '';
    for (let i = 0; i < totalSteps; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i < currentStep) dot.classList.add('done');
        if (i === currentStep) dot.classList.add('active');
        el.progressDots.appendChild(dot);
    }
}

/* ============ КОНФЕТТИ ============ */
function burstConfetti(count = 24) {
    const colors = ['#ff9a3c', '#ff6b35', '#c1440e', '#ffd28a', '#ffe8c4', '#7a2e0e'];
    for (let i = 0; i < count; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = (15 + Math.random() * 70) + '%';
        c.style.top = (25 + Math.random() * 25) + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.transform = `rotate(${Math.random() * 360}deg)`;
        el.scene.appendChild(c);
        requestAnimationFrame(() => c.classList.add('show'));
        setTimeout(() => c.remove(), 1600);
    }
}

/* ============ СТУК ============ */
function performKnock() {
    el.hostCharacter.classList.add('knocking');
    setTimeout(() => el.hostCharacter.classList.remove('knocking'), 560);
    el.knockEffect.classList.add('show');
    setTimeout(() => el.knockEffect.classList.remove('show'), 700);
}

/* ============ РЕНДЕР ============ */
function renderStep() {
    el.hostStage.classList.add('hidden');
    el.familyStage.style.display = 'none';
    el.finaleStage.style.display = 'none';
    el.btnBack.disabled = (currentStep === 0);

    if (currentStep === 0) {
        el.hostStage.classList.remove('hidden');
        el.hostBubble.textContent = 'Ооооо, у кого это тут день рождение?! 👀';
        setTimeout(performKnock, 400);
    }
    else if (currentStep === 1) {
        el.hostStage.classList.remove('hidden');
        el.hostBubble.textContent = 'Вижу тут именинника! 👀 Проходи уже, тебя ждут! 🎉';
        performKnock();
    }
    else if (currentStep >= 2 && currentStep <= 1 + familyMembers.length) {
        const member = familyMembers[currentStep - 2];
        el.familyStage.style.display = 'flex';
        el.familyStage.innerHTML = `
            <div class="family-card">
                <div class="avatar-wrap">
                    <span class="emoji">${member.emoji}</span>
                </div>
                <div class="name-tag">${member.role}: ${member.name}</div>
                <div class="speech-bubble">${member.text}</div>
            </div>`;
        burstConfetti(18);
    }
    else if (currentStep === totalSteps - 1) {
        el.finaleStage.style.display = 'block';
        el.finaleStage.innerHTML = `
            <div class="finale">
                <div class="big-emoji">${finaleText.emoji}</div>
                <h1>${finaleText.title}</h1>
                <p>${finaleText.body}</p>
            </div>`;
        burstConfetti(40);
        setTimeout(() => burstConfetti(30), 400);
    }

    if (currentStep < totalSteps - 1) {
        el.btnNext.textContent = 'Читать далее ➡️';
    } else {
        el.btnNext.textContent = 'Начать заново 🔄';
    }

    renderDots();
}

/* ============ НАВИГАЦИЯ ============ */
function goNext() {
    if (currentStep < totalSteps - 1) {
        currentStep++;
        renderStep();
    } else {
        currentStep = 0;
        renderStep();
    }
}

function goBack() {
    if (currentStep > 0) {
        currentStep--;
        renderStep();
    }
}

/* ============ ОБРАБОТЧИКИ ============ */
el.btnNext.addEventListener('click', goNext);
el.btnBack.addEventListener('click', goBack);

el.hostCharacter.addEventListener('click', () => {
    performKnock();
    burstConfetti(10);
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft') goBack();
});

/* ============ СТАРТ ============ */
renderStep();
</script>
</body>
</html>
